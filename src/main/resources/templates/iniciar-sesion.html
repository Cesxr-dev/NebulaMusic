<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula Music - Iniciar Sesión</title>
    <link rel="stylesheet" href="../static/styles/styles.css">
</head>
<body>

    <main class="auth-container">
        <section class="auth-card">
            <form method="post" action="/autentication" enctype="application/x-www-form-urlencoded" >
                <h1>Iniciar Sesion</h1>
                <div>
                    <label for="correo">Correo Electronico</label>
                    <input
                            type="email"
                            id="correo"
                            name="correo"
                            placeholder="Ej. nombre@example.com"
                            required
                            minlength="5"
                            maxlength="100">
                </div>

                <div>
                    <label for="contrasenia">Contraseña</label>
                    <input
                            type="password"
                            id="contrasenia"
                            name="contrasenia"
                            placeholder="Ej. 1234q"
                            required
                            minlength="5"
                            maxlength="100">
                </div>

                <div>
                    <button type="button"> Iniciar sesion</button>
                    <button type="reset"> Limpiar Formulario</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>Copyright Nébula 2025.</p>
    </footer>

</body>
</html>
