<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula Music - Iniciar Sesión</title>
    <link rel="stylesheet" href="../static/styles/styles.css">
</head>
<body>

<!-- MENÚ DE NAVEGACIÓN -->
<nav>
    <a class="logo" href="index.html">
        <img src="../static/imgs/nebula-03.svg" alt="Logo Nébula" width="100">
    </a>

    <input type="checkbox" id="menu-toggle">
    <label for="menu-toggle" class="menu-button">
        <span></span>
        <span></span>
        <span></span>
    </label>

    <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="iniciar-sesion.html">Iniciar Sesión</a></li>
        <li><a href="registro.html">Registrarse</a></li>
    </ul>
</nav>

<main class="auth-container">
    <section class="auth-card">
        <form method="post" action="/autentication" enctype="application/x-www-form-urlencoded" >

            <div class="form-logo">
                <img src="../static/imgs/nebula-03.png" alt="Logo Nébula">
            </div>

            <div class="form-header">
                <h3>Inicia Sesión</h3>
                <p class="form-subtitle">Ingresa tus credenciales de acceso</p>
            </div>

            <div class="form-group">
                <label for="correo">Correo Electronico</label>
                <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="Ej. nombre@example.com"
                        required
                        minlength="5"
                        maxlength="100">
            </div>

            <div class="form-group">
                <label for="contrasenia">Contraseña</label>
                <input
                        type="password"
                        id="contrasenia"
                        name="contrasenia"
                        placeholder="Ej. 1234q"
                        required
                        minlength="5"
                        maxlength="100">
            </div>

            <div class="form-group">
                <button type="submit" class="btn-primary"> Iniciar sesion</button>
                <button type="reset" class="btn-secondary"> Limpiar Formulario</button>
            </div>
        </form>
        <p class="link">Aun no tienes una cuenta? <a href="registro.html">Registrate aqui</a></p>
    </section>
</main>

<footer>
    <p>Copyright Nébula 2025.</p>
</footer>

</body>
</html>
